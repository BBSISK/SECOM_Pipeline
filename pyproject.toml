[project]
name = "secom-pipeline"
version = "0.1.0"
description = "Streaming SPC pipeline on AWS over a simulated replay of the SECOM fab dataset"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, and S: flake8-bandit security rules (SECOM-19)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert (that is how pytest works), seeded random data, and run the repo's own scripts.
"tests/**" = ["S101", "S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pandas 2.x resample() triggers a NumPy deprecation inside pandas itself, not in our code.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
