# Dependabot (SECOM-19): opens a pull request when a dependency has a newer or patched version.
# Each update PR goes through the same CI and security gate as any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The producer's base image (python:3.12-slim on Amazon ECR Public).
  - package-ecosystem: docker
    directory: "/producer"
    schedule:
      interval: weekly
      day: monday
