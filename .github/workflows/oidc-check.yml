# Proves GitHub Actions can reach AWS with no stored keys.
name: oidc-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to AWS with OIDC (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show which AWS identity this run received
        run: aws sts get-caller-identity
