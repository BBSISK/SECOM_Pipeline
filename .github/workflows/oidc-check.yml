# Move this file to .github/workflows/oidc-check.yml (see docs/security.md).
# Proves GitHub Actions can reach AWS with no stored keys.
name: oidc-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Show the OIDC claims GitHub sends (no token printed)
        run: |
          echo "Role variable: ${{ vars.AWS_PLAN_ROLE_ARN }}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['sub','aud','iss','repository','ref','event_name']}, indent=2))" "$TOKEN"

      - name: Sign in to AWS with OIDC (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show which AWS identity this run received
        run: aws sts get-caller-identity
