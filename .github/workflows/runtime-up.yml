# Bring the runtime stack up for a demo (SECOM-22).
# One button: Actions -> runtime-up -> Run workflow (main only). Shows the plan in the run
# summary, then applies exactly that plan with the keyless OIDC apply role.
# runtime-down tears it down again, by hand or automatically after MAX_UP_HOURS (see runtime-down.yml).
name: runtime-up

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token for AWS (no stored keys)

# Shared with runtime-down, so an up and a down can never run at the same time.
concurrency:
  group: runtime-stack
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ALERTS_TOPIC_ARN: ${{ vars.ALERTS_TOPIC_ARN }}

jobs:
  up:
    name: runtime-up
    if: github.ref == 'refs/heads/main' # the apply role trusts main only; fail fast elsewhere
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Sign in to AWS with OIDC (apply role, main only)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (remote state)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan (shown in the run summary)
        run: |
          terraform plan -input=false -lock-timeout=60s -no-color -out=up.tfplan | tee plan.txt
          {
            echo "### runtime-up: plan"
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply exactly that plan
        run: |
          terraform apply -input=false -lock-timeout=60s -no-color up.tfplan | tail -n 25
          {
            echo "### runtime-up: applied at $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "runtime-down removes it automatically after it has been up for its MAX_UP_HOURS limit."
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure() && steps.aws.outcome == 'success' && env.ALERTS_TOPIC_ARN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aws sns publish --topic-arn "$ALERTS_TOPIC_ARN" \
            --subject "[SECOM] runtime-up FAILED" \
            --message "$(printf 'runtime-up failed; the runtime stack may be partly created.\n\nCommit: %s\nRun: %s\n\nRun runtime-down to clean up.\n' "$GITHUB_SHA" "$RUN_URL")"
