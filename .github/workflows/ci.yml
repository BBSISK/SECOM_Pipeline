# Continuous integration: must pass before any pull request can merge into main.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: python -m pytest

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job sign in to AWS with GitHub OIDC (no stored keys)
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate runtime stack
        working-directory: infra/runtime
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Sign in to AWS with OIDC (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show which AWS identity this run received
        run: aws sts get-caller-identity

      # The bootstrap stack is never planned or applied by CI (see docs/security.md).
      - name: Plan runtime stack
        working-directory: infra/runtime
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=eu-west-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=60s -no-color -out=runtime.tfplan | tee plan.txt
          {
            echo "### Terraform plan: runtime stack"
            echo '```'
            tail -n 40 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  producer-image:
    name: producer-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the replay producer image
        run: docker build -f producer/Dockerfile -t secom-producer:ci .

      - name: Smoke test on fake data (the real dataset is never in CI)
        run: |
          python scripts/fake_secom.py --runs 5 --out "$RUNNER_TEMP/fake-secom"
          docker run --rm \
            -v "$RUNNER_TEMP/fake-secom:/data:ro" \
            -e RATE_SECONDS=0 \
            secom-producer:ci > "$RUNNER_TEMP/replay.jsonl"
          python scripts/check_replay_output.py "$RUNNER_TEMP/replay.jsonl" --expect 5

      - name: Image size
        run: docker image ls secom-producer:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}" >> "$GITHUB_STEP_SUMMARY"
