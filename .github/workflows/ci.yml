# Continuous integration: must pass before any pull request can merge into main.
# Includes the shift-left security gate (SECOM-19): every check below runs on every pull request,
# so a security problem blocks the merge instead of being found after deployment.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Security tools are downloaded as release binaries and checked against a SHA-256 written here,
# so a tampered release cannot run in CI (see "Supply chain" in docs/security.md).
# Dependabot does not update these two; bump the version and checksum together by hand.
env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"

jobs:
  python:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint and test tools
        run: python -m pip install -r requirements-dev.txt

      # Ruff includes the "S" (Bandit) security rules, set in pyproject.toml.
      - name: Lint and security rules (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Known vulnerabilities in Python dependencies (pip-audit)
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          pip-audit -r requirements-dev.txt --progress-spinner off

      - name: Unit tests (pytest)
        run: python -m pytest

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job sign in to AWS with GitHub OIDC (no stored keys)
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Misconfiguration scan of the Terraform and the Dockerfile. Accepted findings, each with its
      # reason, are in .trivyignore.yaml; anything else at HIGH or CRITICAL fails the run.
      - name: Infrastructure config scan (Trivy)
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate runtime stack
        working-directory: infra/runtime
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Sign in to AWS with OIDC (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show which AWS identity this run received
        run: aws sts get-caller-identity

      # The bootstrap stack is never planned or applied by CI (see docs/security.md).
      - name: Plan runtime stack
        working-directory: infra/runtime
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=eu-west-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=60s -no-color -out=runtime.tfplan | tee plan.txt
          {
            echo "### Terraform plan: runtime stack"
            echo '```'
            tail -n 40 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  producer-image:
    name: producer-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Hadolint and Trivy (checksums verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Dockerfile best practice, checked before anything is built. Warnings fail the run.
      - name: Lint the Dockerfile (Hadolint)
        run: hadolint --failure-threshold warning producer/Dockerfile

      - name: Build the replay producer image
        run: docker build -f producer/Dockerfile -t secom-producer:ci .

      # Known vulnerabilities in the image (base OS packages and Python). Fails on HIGH or CRITICAL
      # that have a fix available; unfixed ones are reported by ECR's scan after publish instead.
      - name: Image vulnerability scan (Trivy)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --scanners vuln secom-producer:ci

      - name: Smoke test on fake data (the real dataset is never in CI)
        run: |
          python scripts/fake_secom.py --runs 5 --out "$RUNNER_TEMP/fake-secom"
          docker run --rm \
            -v "$RUNNER_TEMP/fake-secom:/data:ro" \
            -e RATE_SECONDS=0 \
            secom-producer:ci > "$RUNNER_TEMP/replay.jsonl"
          python scripts/check_replay_output.py "$RUNNER_TEMP/replay.jsonl" --expect 5

      - name: Image size
        run: docker image ls secom-producer:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}" >> "$GITHUB_STEP_SUMMARY"
