# Publish the replay producer image to Amazon ECR on every merge to main (SECOM-16).
# Signs in with the keyless OIDC apply role, which only main can assume.
# On failure, sends one alert to the secom-alerts SNS topic (SECOM-20).
name: publish

on:
  push:
    branches: [main]
    paths:
      - "secom/**"
      - "producer/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Also send a test alert to the secom-alerts topic"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token for AWS (no stored keys)

concurrency:
  group: publish-producer
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: secom-producer
  ALERTS_TOPIC_ARN: ${{ vars.ALERTS_TOPIC_ARN }}

jobs:
  producer-image:
    name: publish-producer-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to AWS with OIDC (apply role, main only)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send a test alert
        if: inputs.test_alert
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aws sns publish --topic-arn "$ALERTS_TOPIC_ARN" \
            --subject "[SECOM] TEST alert from the publish workflow" \
            --message "$(printf 'This is a test alert, sent on purpose (SECOM-20).\n\nRepo: %s\nCommit: %s\nRun: %s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RUN_URL")"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so a re-run for the same commit must not push again.
      - name: Check whether this commit's image is already published
        id: existing
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image for ${{ github.sha }} already in ECR; skipping build and push."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push, tagged with the commit SHA
        id: build
        if: steps.existing.outputs.found == 'false'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # --provenance/--sbom off: push one plain image manifest. With attestations, docker pushes an
          # image index instead, and ECR basic scanning does not scan an index (ScanNotFoundException).
          docker build -f producer/Dockerfile --provenance=false --sbom=false \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Wait for the vulnerability scan and report it
        id: scan
        run: |
          # The scan starts a few seconds after the push, so poll for up to 5 minutes.
          for attempt in $(seq 1 30); do
            status=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="${{ github.sha }}" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "PENDING")
            echo "Scan status (attempt $attempt): $status"
            [ "$status" = "COMPLETE" ] && break
            if [ "$status" = "FAILED" ] || [ "$status" = "UNSUPPORTED_IMAGE" ]; then
              echo "::error::Image scan ended with status $status"
              exit 1
            fi
            sleep 10
          done
          if [ "$status" != "COMPLETE" ]; then
            echo "::error::Image scan did not complete within 5 minutes"
            exit 1
          fi
          findings=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="${{ github.sha }}" \
            --query 'imageScanFindings.findingSeverityCounts' --output json)
          echo "counts=$(echo "$findings" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          {
            echo "### Producer image published"
            echo ""
            echo "\`$IMAGE\`"
            echo ""
            echo "Vulnerability scan (counts by severity; {} means none found):"
            echo '```json'
            echo "$findings"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$findings" | grep -q '"CRITICAL"'; then
            echo "::error::Critical vulnerabilities found in the producer image"
            exit 1
          fi

      # One alert per failed run. It needs the AWS sign-in, so if that step itself failed,
      # GitHub's own failed-run email is the only notice.
      - name: Alert on failure
        if: failure() && steps.aws.outcome == 'success' && env.ALERTS_TOPIC_ARN != ''
        env:
          OUT_ECR: ${{ steps.ecr.outcome }}
          OUT_EXISTING: ${{ steps.existing.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_SCAN: ${{ steps.scan.outcome }}
          SCAN_COUNTS: ${{ steps.scan.outputs.counts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="unknown"
          for pair in "Log in to Amazon ECR:$OUT_ECR" "Check for existing image:$OUT_EXISTING" \
                      "Build and push:$OUT_BUILD" "Vulnerability scan:$OUT_SCAN"; do
            if [ "${pair##*:}" = "failure" ]; then failed="${pair%:*}"; break; fi
          done
          aws sns publish --topic-arn "$ALERTS_TOPIC_ARN" \
            --subject "[SECOM] publish FAILED at: $failed" \
            --message "$(printf 'The producer image publish workflow failed.\n\nFailing step: %s\nScan counts: %s\nRepo: %s\nCommit: %s\nTriggered by: %s (%s)\nRun: %s\n' \
              "$failed" "${SCAN_COUNTS:-not reached}" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
              "$GITHUB_ACTOR" "$GITHUB_EVENT_NAME" "$RUN_URL")"
